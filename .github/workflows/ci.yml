name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Unit, regression, CLI, and HTTP tests
        run: python -m unittest discover -s tests -v

  quality:
    name: Lint, coverage, and distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m coverage run -m unittest discover -s tests
      - run: python -m coverage combine
      - run: python -m coverage report --fail-under=85
      - run: python -m build
      - name: Smoke test installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv /tmp/proofscope-wheel
          /tmp/proofscope-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/proofscope-wheel/bin/proofscope --version
          /tmp/proofscope-wheel/bin/proofscope entails 'A IMP A'
          /tmp/proofscope-wheel/bin/python -c "from importlib.resources import files; from proofscope import verify; p = files('proofscope'); assert p.joinpath('web', 'index.html').is_file(); assert verify(p.joinpath('examples', '02-contraposition.proof').read_text()).valid"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proofscope-distributions
          path: dist/*

name: Bug report
description: Report incorrect verification, diagnostics, or explorer behavior.
body:
  - type: textarea
    id: proof
    attributes:
      label: Smallest proof that reproduces the problem
      render: text
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ProofScope version, Python version, and operating system
    validations:
      required: true
